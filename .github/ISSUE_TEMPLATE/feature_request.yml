name: Feature request
description: Propose a change to the public product or release contracts.
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What operator or contributor problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe observable behavior, not only visual treatment.
    validations:
      required: true
  - type: dropdown
    id: boundary
    attributes:
      label: Intended boundary
      options:
        - Community local core
        - Optional paid presentation
        - Optional hosted service
        - Documentation or tooling
    validations:
      required: true
  - type: textarea
    id: truth
    attributes:
      label: Qualification evidence
      description: What test, supported target, or contract would prove the claim?
